<script type="importmap">
{

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Service Worker：只在正式部署註冊；dev（localhost）主動反註冊＋清快取。
      // 原本 Stale-While-Revalidate 會在 dev 餵舊 bundle，害熱更新看不到最新程式（長按修正被舊快取蓋掉的元兇）。
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var h = location.hostname;
        // dev 判定：localhost／LAN 私有網段／.local（手機連電腦 dev server 用的是 LAN IP，不是 localhost）
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]'
          || /\.local$/.test(h)
          || /^10\./.test(h)
          || /^192\.168\./.test(h)
          || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(h);
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          }
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function (reg) { console.log('ServiceWorker registered:', reg.scope); })
            .catch(function (err) { console.log('ServiceWorker registration failed:', err); });
        });
      })();
    </script>
  </body>
